---
# provision_ec2.yml
# Crea la infraestructura: security group + instancia EC2 etiquetada.
# El inventario dinamico la descubre despues por el tag App.
#
# Credenciales del Job Template:
#   - Amazon Web Services
#   - Sandbox Config
#
# Extra variables:
#   instance_count: 1
#   key_name: <nombre del key pair que exista en AWS>

- name: Aprovisionar instancias EC2
  hosts: localhost
  gather_facts: false
  connection: local

  vars:
    aws_region: us-east-2
    app_name: miapp
    env_name: demo
    instance_type: t3.micro
    instance_count: 1
    key_name: sandbox-key
    sg_name: miapp-sg

  tasks:
    - name: Localizar la VPC por defecto
      amazon.aws.ec2_vpc_net_info:
        region: "{{ aws_region }}"
        filters:
          isDefault: "true"
      register: vpc_info

    - name: Guardar el id de la VPC
      ansible.builtin.set_fact:
        vpc_id: "{{ vpc_info.vpcs[0].vpc_id }}"

    - name: Localizar una subred publica
      amazon.aws.ec2_vpc_subnet_info:
        region: "{{ aws_region }}"
        filters:
          vpc-id: "{{ vpc_id }}"
      register: subnet_info

    - name: Guardar el id de la subred
      ansible.builtin.set_fact:
        subnet_id: "{{ subnet_info.subnets[0].subnet_id }}"

    - name: Crear el security group
      amazon.aws.ec2_security_group:
        name: "{{ sg_name }}"
        description: "SSH y HTTP para {{ app_name }}"
        vpc_id: "{{ vpc_id }}"
        region: "{{ aws_region }}"
        rules:
          - proto: tcp
            ports: [22]
            cidr_ip: 0.0.0.0/0
            rule_desc: SSH
          - proto: tcp
            ports: [80]
            cidr_ip: 0.0.0.0/0
            rule_desc: HTTP
        rules_egress:
          - proto: -1
            cidr_ip: 0.0.0.0/0
        state: present
      register: sg

    - name: Buscar la AMI mas reciente de RHEL 9
      amazon.aws.ec2_ami_info:
        region: "{{ aws_region }}"
        owners: "309956199498"
        filters:
          name: "RHEL-9*x86_64*"
          state: available
          architecture: x86_64
      register: ami_info

    - name: Seleccionar la AMI
      ansible.builtin.set_fact:
        ami_id: "{{ (ami_info.images | sort(attribute='creation_date') | last).image_id }}"

    - name: Lanzar las instancias
      amazon.aws.ec2_instance:
        name: "{{ app_name }}-{{ env_name }}"
        region: "{{ aws_region }}"
        instance_type: "{{ instance_type }}"
        image_id: "{{ ami_id }}"
        key_name: "{{ key_name }}"
        subnet_id: "{{ subnet_id }}"
        security_groups:
          - "{{ sg.group_id }}"
        network_interfaces:
          - assign_public_ip: true
        exact_count: "{{ instance_count }}"
        wait: true
        wait_timeout: 600
        tags:
          App: "{{ app_name }}"
          Env: "{{ env_name }}"
          Role: web
          ManagedBy: ansible
      register: ec2

    - name: Esperar a que SSH responda
      ansible.builtin.wait_for:
        host: "{{ item.public_ip_address }}"
        port: 22
        state: started
        timeout: 300
      loop: "{{ ec2.instances }}"
      loop_control:
        label: "{{ item.public_ip_address }}"

    - name: Resumen
      ansible.builtin.debug:
        msg: >-
          {{ ec2.instances | length }} instancia(s) lista(s):
          {{ ec2.instances | map(attribute='public_ip_address') | join(', ') }}