---
# provision_ec2.yml
#
# Crea TODA la infraestructura de red desde cero y levanta las instancias:
#   VPC -> Internet Gateway -> Subred publica -> Tabla de rutas ->
#   Security Group -> Instancias EC2
#
# Es idempotente: si algo ya existe lo reutiliza, no lo duplica.
#
# Credenciales del Job Template:
#   - Amazon Web Services
#
# Extra variables opcionales:
#   instance_count: 1
#   key_name: sandbox-key

- name: Aprovisionar red e instancias EC2
  hosts: localhost
  gather_facts: false
  connection: local

  vars:
    aws_region: us-east-2
    app_name: miapp
    env_name: demo
    instance_type: t3.micro
    instance_count: 1
    key_name: sandbox-key

    vpc_name: "{{ app_name }}-vpc"
    vpc_cidr: "10.0.0.0/16"
    subnet_cidr: "10.0.1.0/24"
    sg_name: "{{ app_name }}-sg"

  tasks:

    # ---------------- RED ----------------

    - name: Crear la VPC
      amazon.aws.ec2_vpc_net:
        name: "{{ vpc_name }}"
        cidr_block: "{{ vpc_cidr }}"
        region: "{{ aws_region }}"
        dns_support: true
        dns_hostnames: true
        state: present
        tags:
          App: "{{ app_name }}"
          Env: "{{ env_name }}"
          ManagedBy: ansible
      register: vpc

    - name: Guardar el id de la VPC
      ansible.builtin.set_fact:
        vpc_id: "{{ vpc.vpc.id }}"

    - name: Crear el Internet Gateway
      amazon.aws.ec2_vpc_igw:
        vpc_id: "{{ vpc_id }}"
        region: "{{ aws_region }}"
        state: present
        tags:
          Name: "{{ app_name }}-igw"
          App: "{{ app_name }}"
          ManagedBy: ansible
      register: igw

    - name: Consultar las zonas de disponibilidad
      amazon.aws.aws_az_info:
        region: "{{ aws_region }}"
      register: az_info

    - name: Crear la subred publica
      amazon.aws.ec2_vpc_subnet:
        vpc_id: "{{ vpc_id }}"
        cidr: "{{ subnet_cidr }}"
        az: "{{ az_info.availability_zones[0].zone_name }}"
        region: "{{ aws_region }}"
        map_public: true
        state: present
        tags:
          Name: "{{ app_name }}-subnet-public"
          App: "{{ app_name }}"
          ManagedBy: ansible
      register: subnet

    - name: Guardar el id de la subred
      ansible.builtin.set_fact:
        subnet_id: "{{ subnet.subnet.id }}"

    - name: Crear la tabla de rutas y apuntarla al IGW
      amazon.aws.ec2_vpc_route_table:
        vpc_id: "{{ vpc_id }}"
        region: "{{ aws_region }}"
        subnets:
          - "{{ subnet_id }}"
        routes:
          - dest: 0.0.0.0/0
            gateway_id: "{{ igw.gateway_id }}"
        state: present
        tags:
          Name: "{{ app_name }}-rt-public"
          App: "{{ app_name }}"
          ManagedBy: ansible

    # ---------------- SEGURIDAD ----------------

    - name: Crear el security group
      amazon.aws.ec2_security_group:
        name: "{{ sg_name }}"
        description: "SSH y HTTP para {{ app_name }}"
        vpc_id: "{{ vpc_id }}"
        region: "{{ aws_region }}"
        rules:
          - proto: tcp
            ports: [22]
            cidr_ip: 0.0.0.0/0
            rule_desc: SSH
          - proto: tcp
            ports: [80]
            cidr_ip: 0.0.0.0/0
            rule_desc: HTTP
        rules_egress:
          - proto: -1
            cidr_ip: 0.0.0.0/0
        state: present
        tags:
          App: "{{ app_name }}"
          ManagedBy: ansible
      register: sg

    # ---------------- INSTANCIAS ----------------

    - name: Verificar que el key pair exista
      amazon.aws.ec2_key_info:
        region: "{{ aws_region }}"
        names:
          - "{{ key_name }}"
      register: key_check
      failed_when: false

    - name: Avisar si falta el key pair
      ansible.builtin.assert:
        that: key_check.keypairs | default([]) | length > 0
        fail_msg: >-
          No existe el key pair '{{ key_name }}' en {{ aws_region }}.
          Creelo en la consola AWS (EC2 > Key Pairs) o pase key_name
          con el nombre correcto.

    - name: Buscar la AMI mas reciente de RHEL 9
      amazon.aws.ec2_ami_info:
        region: "{{ aws_region }}"
        owners: "309956199498"
        filters:
          name: "RHEL-9*x86_64*"
          state: available
          architecture: x86_64
      register: ami_info

    - name: Seleccionar la AMI
      ansible.builtin.set_fact:
        ami_id: "{{ (ami_info.images | sort(attribute='creation_date') | last).image_id }}"

    - name: Lanzar las instancias
      amazon.aws.ec2_instance:
        name: "{{ app_name }}-{{ env_name }}"
        region: "{{ aws_region }}"
        instance_type: "{{ instance_type }}"
        image_id: "{{ ami_id }}"
        key_name: "{{ key_name }}"
        vpc_subnet_id: "{{ subnet_id }}"
        security_groups:
          - "{{ sg.group_id }}"
        network_interfaces:
          - assign_public_ip: true
        exact_count: "{{ instance_count }}"
        wait: true
        wait_timeout: 600
        tags:
          App: "{{ app_name }}"
          Env: "{{ env_name }}"
          Role: web
          ManagedBy: ansible
      register: ec2

    - name: Esperar a que SSH responda
      ansible.builtin.wait_for:
        host: "{{ item.public_ip_address }}"
        port: 22
        state: started
        timeout: 300
      loop: "{{ ec2.instances }}"
      loop_control:
        label: "{{ item.public_ip_address | default('sin ip') }}"
      when: item.public_ip_address is defined

    - name: Resumen
      ansible.builtin.debug:
        msg:
          - "VPC:    {{ vpc_id }} ({{ vpc_cidr }})"
          - "Subred: {{ subnet_id }} ({{ subnet_cidr }})"
          - "IGW:    {{ igw.gateway_id }}"
          - "SG:     {{ sg.group_id }}"
          - "IPs:    {{ ec2.instances | map(attribute='public_ip_address') | join(', ') }}"